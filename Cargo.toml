[package]
name = "ikun_desktop_organization"
version = "0.1.0"
edition = "2021"
authors = ["baiwusanyu"]
description = "桌面图标智能分类管理工具 - Desktop Organizer"
license = "MIT"

[dependencies]
# ===== GUI 框架 =====
egui = "0.27"
eframe = { version = "0.27", default-features = false, features = ["glow"] }
epaint = "0.27"

# ===== 通用库 =====
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6.0"
dirs = "5.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# ===== Windows API =====
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
]}

# ===== macOS API =====
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
objc-foundation = "0.1"

# ===== 开发依赖 =====
[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true