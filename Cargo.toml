[package]
name = "ikun_organizer"
version = "0.1.0-beta.5"
edition = "2021"
authors = ["baiwusanyu"]
description = "ikun Desktop Organizer"
license = "MIT"
build = "build/build.rs"

[dependencies]
lazy_static = "1.4"
# ===== Tauri 2.0 (sole UI runtime) =====
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# ===== HTTP / Async =====
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time"] }

# ===== Common libraries =====
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6.0"
dirs = "5.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# ===== Windows API =====
[target.'cfg(windows)'.dependencies]
# 注：Win32_Graphics_Direct3D_Fxc 供 liquid_glass 运行时 D3DCompile 编译
# 着色器使用，不是可选 UI 的遗留依赖，勿删。
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Foundation_Numerics",
] }

# ===== Build Dependencies =====
[build-dependencies]
tauri-build = { version = "2", features = [] }
# 与 tauri-build 相同的资源编译器发现机制（PATH + Windows SDK 注册表 + vswhom），
# 保证 rc.exe/windres 不在 PATH 的机器上也能嵌入图标与清单。
embed-resource = "3"

# ===== Dev Dependencies =====
[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true
