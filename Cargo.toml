[package]
name = "ikun_organizer"
version = "0.1.0"
edition = "2021"
authors = ["baiwusanyu"]
description = "ikun 桌面收纳器 - Desktop Organizer"
license = "MIT"
build = "build/build.rs"

[dependencies]
# ===== GUI 框架 =====
egui = "0.27"
eframe = { version = "0.27", default-features = false, features = ["glow"] }
epaint = "0.27"

# ===== 通用库 =====
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6.0"
dirs = "5.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# ===== Windows API =====
[target.'cfg(windows)'.dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Foundation_Numerics",
]}

# ===== macOS API =====
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
objc-foundation = "0.1"
core-foundation = "0.9"
core-graphics = "0.23"
core-text = "20"
foreign-types-shared = "0.3"
block = "0.1"
libc = "0.2"
# ===== 开发依赖 =====
[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true


[features]
default = []
eframe-ui = []
