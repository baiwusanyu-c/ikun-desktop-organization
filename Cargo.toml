[package]
name = "ikun_organizer"
version = "0.1.0"
edition = "2021"
authors = ["baiwusanyu"]
description = "ikun 桌面收纳器 - Desktop Organizer"
license = "MIT"
build = "build/build.rs"

[dependencies]
# ===== GUI 框架 =====
egui = "0.27"
eframe = { version = "0.27", default-features = false, features = ["glow"] }
epaint = "0.27"

# ===== 通用库 =====
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6.0"
dirs = "5.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# ===== Windows API =====
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",              # Shell API（桌面图标、IShellFolder、IShellLink）
    "Win32_UI_Shell_Common",       # Shell 通用类型（ITEMIDLIST、SHParseDisplayName 等）
    "Win32_System_Com",            # COM 组件（CoInitializeEx、CoUninitialize）
    "Win32_System_Ole",            # OLE（IShellView 依赖）
    "Win32_UI_WindowsAndMessaging", # 窗口管理（FindWindow、SetWindowPos、CreateWindowExW）
    "Win32_Storage_FileSystem",    # 文件系统操作
    "Win32_Graphics_Gdi",          # GDI（绘图、COLORREF、HDC、BitBlt）
    "Win32_Foundation",            # 基础类型（HWND、HRESULT、RECT 等）
    "Win32_System_Memory",         # VirtualAllocEx、VirtualFreeEx、ReadProcessMemory、WriteProcessMemory
    "Win32_System_Threading",      # OpenProcess
    "Win32_System_Diagnostics_Debug", # PROCESS_VM_* 权限常量
    "Win32_UI_Controls",           # LVM_* 常量、LVITEM 结构体
    "Win32_System_LibraryLoader",  # GetModuleHandleW

    # Direct2D（2D 图形渲染 - 替代 GDI）
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",

    # DirectWrite（高质量文字渲染）
    "Win32_Graphics_DirectWrite",

    # DXGI（D2D 依赖）
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",

    # WIC（图标 HICON → D2D bitmap 转换）
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",

    # Foundation Numerics（D2D brush 颜色类型依赖）
    "Foundation_Numerics",
]}

# ===== macOS API =====
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
objc-foundation = "0.1"

# ===== 开发依赖 =====
[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true