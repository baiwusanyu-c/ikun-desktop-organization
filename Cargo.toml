[package]
name = "ikun_organizer"
version = "0.1.0"
edition = "2021"
authors = ["baiwusanyu"]
description = "ikun Desktop Organizer"
license = "MIT"
build = "build/build.rs"

[dependencies]
lazy_static = "1.4"
# ===== GUI frameworks =====
egui = { version = "0.27", optional = true }
eframe = { version = "0.27", default-features = false, features = ["glow"], optional = true }
epaint = { version = "0.27", optional = true }

# ===== Tauri 2.0 =====
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

# ===== HTTP / Async =====
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time"] }

# ===== Common libraries =====
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6.0"
dirs = "5.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# ===== Windows API =====
[target.'cfg(windows)'.dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Foundation_Numerics",
]}

# ===== macOS API =====
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
objc-foundation = "0.1"
core-foundation = "0.9"
core-graphics = "0.23"
core-text = "20"
foreign-types-shared = "0.3"
block = "0.1"
libc = "0.2"

# ===== Build Dependencies =====
[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

# ===== Dev Dependencies =====
[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true

[features]
default = ["tauri-ui"]
eframe-ui = ["dep:egui", "dep:eframe", "dep:epaint"]
tauri-ui = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:tauri-build"]
