<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建分类</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
  -webkit-font-smoothing: antialiased;
}
.window {
  width: 400px;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border-radius: 14px;
  border: 0.5px solid rgba(255,255,255,0.5);
  box-shadow: 0 24px 80px rgba(0,0,0,0.12), 0 8px 24px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.05);
  overflow: hidden;
}
.titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px;
}
.titlebar h1 { font-size: 16px; font-weight: 600; color: #1d1d1f; letter-spacing: -0.2px; }
.close-btn {
  width: 26px; height: 26px; border-radius: 50%;
  border: none; background: rgba(0,0,0,0.06);
  cursor: pointer; font-size: 16px; color: #86868b;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.close-btn:hover { background: rgba(0,0,0,0.12); color: #1d1d1f; }
.form-body { padding: 4px 20px 20px; }
.field-label {
  font-size: 12px; font-weight: 600; color: #6e6e73;
  margin-bottom: 8px; display: block;
}
.form-input {
  width: 100%; height: 40px;
  background: rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 10px; padding: 0 14px;
  font-size: 14px; color: #1d1d1f;
  font-family: inherit; transition: all 0.25s ease; outline: none;
}
.form-input:focus {
  border-color: #14b8a6; background: #fff;
  box-shadow: 0 0 0 3px rgba(20,184,166,0.15);
}
.form-input::placeholder { color: #aeaeb2; }
.form-footer {
  padding: 12px 20px 16px;
  display: flex; justify-content: flex-end; gap: 8px;
}
.btn {
  height: 34px; padding: 0 18px; border-radius: 8px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  border: none; font-family: inherit; transition: all 0.2s;
}
.btn-secondary { background: rgba(0,0,0,0.06); color: #1d1d1f; }
.btn-secondary:hover { background: rgba(0,0,0,0.1); }
.btn-primary {
  background: #14b8a6; color: #fff;
  box-shadow: 0 1px 3px rgba(20,184,166,0.3);
}
.btn-primary:hover { background: #0d9488; }
.btn-primary:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <h1>创建分类</h1>
    <button class="close-btn">&times;</button>
  </div>
  <div class="form-body">
    <label class="field-label">分类名称</label>
    <input class="form-input" type="text" placeholder="请输入分类名称...">
  </div>
  <div class="form-footer">
    <button class="btn btn-secondary">取消</button>
    <button class="btn btn-primary">确认</button>
  </div>
</div>
</body>
</html>
