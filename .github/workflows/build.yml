# =============================================================================
# CI workflow: build + test on every push/PR to master.
#
# Notes:
# - Windows is the only supported platform (Win32 + Direct2D + Tauri WebView2).
# =============================================================================
name: Windows CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 版本取自根 package.json 的 packageManager 字段（pnpm@11.5.1）；
        # 必须先于 setup-node，否则其 cache: pnpm 找不到 pnpm 可执行文件
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"  # pnpm 11 要求 Node >= 22.13（node:sqlite）
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Build frontend
        # tauri::generate_context! requires frontendDist to exist at compile time
        run: pnpm -C frontend run build

      - name: Check frontend types (svelte-check + tsc)
        run: pnpm -C frontend run check

      - name: Format Check
        run: cargo fmt -- --check

      - name: Clippy
        # Lint-debt allowlist for legacy platform code.
        # TODO: shrink this list over time (FFI consolidation, doc cleanup).
        # New warnings outside this list still fail CI.
        # 2026-11-04 自检审计：dead_code / unused_variables / unused_assignments /
        # unused_mut / clashing_extern_declarations 五项已清零并移出 allowlist，
        # 今后同类告警直接卡红 CI。剩余条目均为历史格式/风格类抑制，只减不增。
        run: >
          cargo clippy --all-targets -- -D warnings
          -A clippy::too_many_arguments
          -A clippy::type_complexity
          -A clippy::upper_case_acronyms
          -A clippy::empty_line_after_outer_attr
          -A clippy::empty_line_after_doc_comments
          -A clippy::doc_lazy_continuation
          -A clippy::tabs_in_doc_comments
          -A clippy::assertions_on_constants
          -A clippy::missing_const_for_thread_local
          -A clippy::field_reassign_with_default
          -A clippy::needless_range_loop
          -A clippy::unnecessary_cast
          -A clippy::module_inception
          -A clippy::items_after_test_module
          -A clippy::vec_init_then_push

      - name: Build
        run: node scripts/build.mjs --platform win --mode release

      - name: Test
        run: cargo test

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: ikun-organizer-windows-exe
          path: target/dist/*windows*.exe

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ikun-organizer-windows-installers
          path: |
            target/dist/*setup*.exe
            target/dist/*.msi
            target/dist/*.zip
