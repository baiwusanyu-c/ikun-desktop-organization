# =============================================================================
# CI workflow: build + test on every push/PR to master.
#
# Notes:
# - fmt/clippy run on Windows because that is the shipping target; the crate
#   cannot compile on bare ubuntu runners (Tauri needs webkit2gtk system libs).
# - The macOS job is RESERVED: macOS support is not implemented yet, so its
#   failure must not block CI (continue-on-error).
# =============================================================================
name: Cross-Platform Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        # tauri::generate_context! requires frontendDist to exist at compile time
        run: npm --prefix frontend run build

      - name: Check frontend types (svelte-check + tsc)
        run: npm --prefix frontend run check

      - name: Format Check
        run: cargo fmt -- --check

      - name: Clippy
        # Lint-debt allowlist for legacy platform code.
        # TODO: shrink this list over time (FFI consolidation, doc cleanup).
        # New warnings outside this list still fail CI.
        run: >
          cargo clippy --all-targets -- -D warnings
          -A dead_code
          -A unused_variables
          -A unused_assignments
          -A unused_mut
          -A clashing_extern_declarations
          -A clippy::too_many_arguments
          -A clippy::type_complexity
          -A clippy::upper_case_acronyms
          -A clippy::empty_line_after_outer_attr
          -A clippy::empty_line_after_doc_comments
          -A clippy::doc_lazy_continuation
          -A clippy::tabs_in_doc_comments
          -A clippy::assertions_on_constants
          -A clippy::missing_const_for_thread_local
          -A clippy::field_reassign_with_default
          -A clippy::needless_range_loop
          -A clippy::unnecessary_cast
          -A clippy::module_inception
          -A clippy::items_after_test_module
          -A clippy::vec_init_then_push

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build
        run: node scripts/build.mjs --platform win --mode release

      - name: Test
        run: cargo test

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: ikun-organizer-windows-exe
          path: dist/*windows*.exe

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ikun-organizer-windows-installers
          path: |
            dist/*setup*.exe
            dist/*.msi
            dist/*.zip

  build-macos:
    # RESERVED: macOS support is not implemented yet.
    # Keep the job wired up so it starts validating automatically once the
    # macOS platform work lands; failures must not block CI until then.
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build
        run: node scripts/build.mjs --platform mac --mode release

      - name: Test
        run: cargo test

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ikun-organizer-macos
          path: |
            dist/*.app
            dist/*.dmg
            dist/*.zip
