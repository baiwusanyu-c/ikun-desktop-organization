# =============================================================================
# Release workflow: tag -> test gate -> package -> publish GitHub Release
#
# Flow:
#   1. Triggered by a version tag (v*) push or manual dispatch.
#   2. Test gate: fmt + clippy + cargo test must pass first.
#   3. Only then are Windows artifacts packaged.
#   4. Artifacts + SHA256 are published to the GitHub Releases page.
#
# Trigger from local (recommended):
#   pnpm run release -- --bump beta --push     (scripts/release.mjs)
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v prefix, e.g. 0.1.0-beta.2)"
        required: true
        default: "0.1.0-beta.1"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: quality gate. Packaging only happens if this passes.
  # ------------------------------------------------------------------
  test:
    name: Test gate (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 版本取自根 package.json 的 packageManager 字段（pnpm@11.5.1）；
        # 必须先于 setup-node，否则其 cache: pnpm 找不到 pnpm 可执行文件
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Build frontend
        # tauri::generate_context! requires frontendDist to exist at compile time
        run: pnpm -C frontend run build

      - name: Check frontend types (svelte-check + tsc)
        run: pnpm -C frontend run check

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        # Lint-debt allowlist for legacy platform code.
        # TODO: shrink this list over time (FFI consolidation, doc cleanup).
        # New warnings outside this list still fail CI.
        run: >
          cargo clippy --all-targets -- -D warnings
          -A dead_code
          -A unused_variables
          -A unused_assignments
          -A unused_mut
          -A clashing_extern_declarations
          -A clippy::too_many_arguments
          -A clippy::type_complexity
          -A clippy::upper_case_acronyms
          -A clippy::empty_line_after_outer_attr
          -A clippy::empty_line_after_doc_comments
          -A clippy::doc_lazy_continuation
          -A clippy::tabs_in_doc_comments
          -A clippy::assertions_on_constants
          -A clippy::missing_const_for_thread_local
          -A clippy::field_reassign_with_default
          -A clippy::needless_range_loop
          -A clippy::unnecessary_cast
          -A clippy::module_inception
          -A clippy::items_after_test_module
          -A clippy::vec_init_then_push

      - name: Run tests
        run: cargo test

  # ------------------------------------------------------------------
  # Job 2: verify tag/version consistency, then package Windows and
  # publish the GitHub Release.
  # ------------------------------------------------------------------
  release-windows:
    name: Release (Windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v${{ github.event.inputs.version }}"
          }
          $version = $tag -replace '^v', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release: $tag (version $version)"

      - name: Verify version consistency
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $versionLine = Get-Content Cargo.toml | Where-Object { $_ -match '^\s*version\s*=' } | Select-Object -First 1
          if (-not $versionLine -or $versionLine -notmatch [regex]::Escape($version)) {
            Write-Error "Cargo.toml version ($versionLine) does not match release version ($version). Bump the project version first (pnpm run release -- --bump <level>)."
            exit 1
          }
          Write-Host "Version check passed: $versionLine"

      - name: Setup pnpm
        # 版本取自根 package.json 的 packageManager 字段（pnpm@11.5.1）；
        # 必须先于 setup-node，否则其 cache: pnpm 找不到 pnpm 可执行文件
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Windows artifacts
        run: node scripts/build.mjs --platform win --mode release

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem target/dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath target/dist/SHA256SUMS.txt -Encoding utf8
          Get-Content target/dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Desktop Organizer ${{ steps.ver.outputs.tag }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          append_body: true
          files: |
            target/dist/*
          body: |
            > **Beta notice**: this build is unsigned and only smoke-tested.
            > Windows SmartScreen may warn on first run ("More info" -> "Run anyway").

            ### Downloads
            | File | Description |
            | --- | --- |
            | `*-setup.exe` | NSIS installer (recommended, per-user install) |
            | `*.msi` | MSI installer (stable releases only - MSI requires a numeric version, skipped for pre-releases) |
            | `*.zip` | Portable build (unzip and run) |
            | `SHA256SUMS.txt` | SHA256 checksums |

            Verify integrity (PowerShell): `Get-FileHash <file> -Algorithm SHA256`
