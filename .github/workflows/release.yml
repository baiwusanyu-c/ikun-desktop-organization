# =============================================================================
# Release workflow: tag -> test gate -> package -> publish GitHub Release
#
# Flow:
#   1. Triggered by a version tag (v*) push or manual dispatch.
#   2. Test gate: fmt + clippy + cargo test must pass first.
#   3. Only then are Windows artifacts packaged and updater packages signed.
#   4. Artifacts + SHA256 + latest.json are published to the version release.
#   5. latest.json is mirrored to the fixed prerelease `beta` rolling channel.
#
# Trigger from local (recommended):
#   pnpm run release -- --bump beta --push     (scripts/release.mjs)
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v prefix, e.g. 0.1.0-beta.2)"
        required: true
        default: "0.1.0-beta.1"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: quality gate. Packaging only happens if this passes.
  # ------------------------------------------------------------------
  test:
    name: Test gate (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 版本取自根 package.json 的 packageManager 字段（pnpm@11.5.1）；
        # 必须先于 setup-node，否则其 cache: pnpm 找不到 pnpm 可执行文件
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"  # pnpm 11 要求 Node >= 22.13（node:sqlite）
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Build frontend
        # tauri::generate_context! requires frontendDist to exist at compile time
        run: pnpm -C frontend run build

      - name: Check frontend types (svelte-check + tsc)
        run: pnpm -C frontend run check

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        # Lint-debt allowlist for legacy platform code.
        # TODO: shrink this list over time (FFI consolidation, doc cleanup).
        # New warnings outside this list still fail CI.
        # 2026-11-04 自检审计：dead_code / unused_variables / unused_assignments /
        # unused_mut / clashing_extern_declarations 五项已清零并移出 allowlist，
        # 今后同类告警直接卡红 CI。剩余条目均为历史格式/风格类抑制，只减不增。
        run: >
          cargo clippy --all-targets -- -D warnings
          -A clippy::too_many_arguments
          -A clippy::type_complexity
          -A clippy::upper_case_acronyms
          -A clippy::empty_line_after_outer_attr
          -A clippy::empty_line_after_doc_comments
          -A clippy::doc_lazy_continuation
          -A clippy::tabs_in_doc_comments
          -A clippy::assertions_on_constants
          -A clippy::missing_const_for_thread_local
          -A clippy::field_reassign_with_default
          -A clippy::needless_range_loop
          -A clippy::unnecessary_cast
          -A clippy::module_inception
          -A clippy::items_after_test_module
          -A clippy::vec_init_then_push

      - name: Run tests
        run: cargo test

  # ------------------------------------------------------------------
  # Job 2: verify tag/version consistency, then package Windows and
  # publish the GitHub Release.
  # ------------------------------------------------------------------
  release-windows:
    name: Release (Windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v${{ github.event.inputs.version }}"
          }
          $version = $tag -replace '^v', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release: $tag (version $version)"

      - name: Verify version consistency
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $versionLine = Get-Content Cargo.toml | Where-Object { $_ -match '^\s*version\s*=' } | Select-Object -First 1
          if (-not $versionLine -or $versionLine -notmatch [regex]::Escape($version)) {
            Write-Error "Cargo.toml version ($versionLine) does not match release version ($version). Bump the project version first (pnpm run release -- --bump <level>)."
            exit 1
          }
          Write-Host "Version check passed: $versionLine"

      - name: Verify updater public key is configured
        shell: pwsh
        run: |
          $config = Get-Content tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json
          $pubkey = "$($config.plugins.updater.pubkey)".Trim()
          if ([string]::IsNullOrWhiteSpace($pubkey) -or $pubkey -eq 'REPLACE_WITH_MINISIGN_PUBLIC_KEY') {
            $message = @(
              'tauri.conf.json 的 plugins.updater.pubkey 仍是占位值 REPLACE_WITH_MINISIGN_PUBLIC_KEY（或缺失）。'
              '未配置真实 minisign 公钥就发布会生成无法被客户端验签的更新，老用户升级会失败。'
              '请先运行 pnpm dlx @tauri-apps/cli@2 signer generate 生成密钥，把公钥写入该字段，'
              '并把私钥与密码配置到 GitHub Secrets（TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD）后再发布。'
            ) -join "`n"
            Write-Error $message
            exit 1
          }
          Write-Host "Updater public key is configured."

      - name: Setup pnpm
        # 版本取自根 package.json 的 packageManager 字段（pnpm@11.5.1）；
        # 必须先于 setup-node，否则其 cache: pnpm 找不到 pnpm 可执行文件
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"  # pnpm 11 要求 Node >= 22.13（node:sqlite）
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Windows artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build.mjs --platform win --mode release --updater

      - name: Generate latest.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"

          $setupAssetName = "ikun_organizer-v$version-windows-x64-setup.exe"
          $setupAssetPath = Join-Path 'target/dist' $setupAssetName
          if (-not (Test-Path -LiteralPath $setupAssetPath -PathType Leaf)) {
            Write-Error "Missing updater setup asset: $setupAssetPath. The signed build must produce and copy the renamed NSIS setup.exe into target/dist."
            exit 1
          }

          $signaturePath = "$setupAssetPath.sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            Write-Error "Missing updater signature: $signaturePath. The signed build did not produce *-setup.exe.sig for the updater setup asset."
            exit 1
          }

          # .sig 实测为单行 base64（无 CR/LF）；仍显式 Trim：手工重打包或跨工具复制引入空白后，
          # 客户端 STANDARD base64 引擎不容忍空白，会直接验签失败。
          $signature = (Get-Content -LiteralPath $signaturePath -Raw -Encoding utf8).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            Write-Error "Updater signature is empty: $signaturePath"
            exit 1
          }

          $notes = ''
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md -Encoding utf8
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match ('^## \[' + [regex]::Escape($tag) + '\]')) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^## \[') { $end = $i; break }
              }
              if ($end - $start -gt 1) {
                $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
              }
            }
          }

          $pubDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = "https://github.com/baiwusanyu-c/ikun-desktop-organization/releases/download/$tag/$setupAssetName"
              }
            }
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath target/dist/latest.json -Encoding utf8NoBOM
          Write-Host "Generated target/dist/latest.json"
          Write-Host "  version: $version"
          Write-Host "  updater asset: $setupAssetName"
          Write-Host "  signature: $signaturePath"

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem target/dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath target/dist/SHA256SUMS.txt -Encoding utf8
          Get-Content target/dist/SHA256SUMS.txt

      - name: Build release notes body
        # 把 CHANGELOG.md 里本次 tag 对应的段落拼进 GitHub Release 正文（发布报表的唯一来源）。
        # CHANGELOG 缺段落时只用静态下载说明，绝不卡住发布。
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          $out = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $staticLines = @(
            '> **Beta notice**: this build is unsigned and only smoke-tested.',
            '> Windows SmartScreen may warn on first run ("More info" -> "Run anyway").',
            '',
            '### Downloads',
            '| File | Description |',
            '| --- | --- |',
            '| `*-setup.exe` | NSIS installer and v2 updater asset (recommended, per-user install) |',
            '| `*.msi` | MSI installer (stable releases only - MSI requires a numeric version, skipped for pre-releases) |',
            '| `ikun_organizer-v*-windows-x64.zip` | Portable build (unzip and run) |',
            '| `*-setup.exe.sig` | minisign signature used by `latest.json` |',
            '| `latest.json` | Updater manifest (also mirrored to the `beta` channel) |',
            '| SHA256SUMS.txt | SHA256 checksums |',
            '',
            'Verify integrity (PowerShell): `Get-FileHash <file> -Algorithm SHA256`'
          )
          $section = ''
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md -Encoding utf8
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match ('^## \[' + [regex]::Escape($tag) + '\]')) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^## \[') { $end = $i; break }
              }
              $section = ($lines[$start..($end - 1)] -join "`n").TrimEnd()
            } else {
              Write-Host "CHANGELOG.md 没有 $tag 段落，仅使用默认下载说明"
            }
          } else {
            Write-Host "未找到 CHANGELOG.md，仅使用默认下载说明"
          }
          $parts = @()
          if ($section) { $parts += "## Changes in $version"; $parts += ''; $parts += $section; $parts += '' }
          $parts += ($staticLines -join "`n")
          $body = ($parts -join "`n") + "`n"
          Set-Content -Path $out -Value $body -Encoding utf8NoBOM -NoNewline
          Write-Host '----- release notes -----'
          Write-Host $body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Desktop Organizer ${{ steps.ver.outputs.tag }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          append_body: true
          files: |
            target/dist/*
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Publish beta rolling channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "beta release does not exist; creating rolling channel..."
            gh release create beta --target "${{ github.sha }}" --title "Beta update channel" --prerelease --notes "Rolling beta update channel. The latest update manifest is attached as latest.json."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "beta release exists; replacing latest.json..."
          }

          gh release upload beta target/dist/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Beta updater endpoint: https://github.com/baiwusanyu-c/ikun-desktop-organization/releases/download/beta/latest.json"
